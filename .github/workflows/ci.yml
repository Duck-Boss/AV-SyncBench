name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          bash -n scripts/download_dataset.sh
          bash -n examples/run_synchformer_demo.sh
          bash -n examples/run_imagebind_demo.sh
      - name: Validate fixture manifest
        run: |
          python scripts/validate_manifest.py \
            --manifest tests/fixtures/global_offset_minimal.jsonl \
            --dataset-root tests/fixtures \
            --skip-file-check \
            --expect-count 1
